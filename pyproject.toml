[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wharton-ic"
version = "0.1.0"
description = "Wharton Global High School Investment Competition Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Wharton IC Quantitative Team", email = "research@wharton-ic.org" }
]
dependencies = [
    "pydantic>=2.10.0",
    "typer>=0.12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "skfolio>=1.2.8",
    "duckdb>=1.1.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.8.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
wharton-ic = "wharton_ic.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wharton_ic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
