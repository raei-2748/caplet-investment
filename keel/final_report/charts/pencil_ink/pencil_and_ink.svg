<svg xmlns="http://www.w3.org/2000/svg" width="468pt" height="138pt" viewBox="0 0 468 138" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif">
<defs><pattern id="pencil" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)"><rect width="3" height="3" fill="#D4D3CF"/><line x1="0" y1="0" x2="0" y2="3" stroke="#6E6D69" stroke-width="0.9"/></pattern></defs>
<rect width="468" height="138" fill="#FFFFFF"/>
<text x="2" y="14" font-size="10.5" fill="#1F1F1F" letter-spacing="1.2" font-weight="bold">INK</text>
<text x="28" y="14" font-size="10.5" fill="#6E6D69" font-style="italic">promised, and held in Treasuries from January 2028</text>
<text x="277.06" y="14" font-size="10.5" fill="#1F1F1F" letter-spacing="1.2" font-weight="bold">PENCIL</text>
<text x="327.06" y="14" font-size="10.5" fill="#6E6D69" font-style="italic">not yet promised</text>
<rect x="2" y="26" width="273.06" height="86" fill="#26394D"/>
<text x="14" y="66.0" font-size="17" fill="#FFFFFF">$595,000</text>
<text x="14" y="82.0" font-size="10.5" fill="#FFFFFF">ten payments of $50,000 and $95,000 for the building</text>
<rect x="277.06" y="26" width="34.94" height="14" fill="url(#pencil)"/>
<text x="320.0" y="36.5" font-size="11" fill="#1F1F1F">Shares do very well</text>
<rect x="277.06" y="50" width="22.34" height="14" fill="url(#pencil)"/>
<text x="320.0" y="60.5" font-size="11" fill="#1F1F1F">Shares earn 7.5% a year</text>
<rect x="277.06" y="74" width="12.54" height="14" fill="url(#pencil)"/>
<text x="320.0" y="84.5" font-size="11" fill="#1F1F1F">Shares fall 40% before 2031</text>
<rect x="277.06" y="98" width="3.38" height="14" fill="url(#pencil)"/>
<text x="320.0" y="108.5" font-size="11" fill="#1F1F1F">Shares become worthless</text>
<line x1="2" y1="128" x2="47.89" y2="128" stroke="#6E6D69" stroke-width="0.8"/>
<line x1="2.00" y1="125" x2="2.00" y2="131" stroke="#6E6D69" stroke-width="0.8"/>
<line x1="47.89" y1="125" x2="47.89" y2="131" stroke="#6E6D69" stroke-width="0.8"/>
<text x="53.89" y="131.5" font-size="9.5" fill="#6E6D69">$100,000</text>
</svg>