<svg xmlns="http://www.w3.org/2000/svg" width="468pt" height="214pt" viewBox="0 0 468 214" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif"><rect width="468" height="214" fill="#fff"/><text x="0" y="15" font-size="13" font-weight="bold" fill="#1A1A1A">Whatever shares do, the building gets at least $95,000</text><text x="0" y="31" font-size="11" fill="#5E5E5B">Laura's facility contribution in 2033, by how world shares perform from 2028</text><line x1="52" x2="468" y1="168.0" y2="168.0" stroke="#1A1A1A" stroke-width="0.8"/><text x="46" y="171.5" font-size="9.5" fill="#5E5E5B" text-anchor="end">$0</text><line x1="52" x2="468" y1="150.9" y2="150.9" stroke="#D9D9D6" stroke-width="0.5"/><text x="46" y="154.4" font-size="9.5" fill="#5E5E5B" text-anchor="end">$20,000</text><line x1="52" x2="468" y1="133.7" y2="133.7" stroke="#D9D9D6" stroke-width="0.5"/><text x="46" y="137.2" font-size="9.5" fill="#5E5E5B" text-anchor="end">$40,000</text><line x1="52" x2="468" y1="116.6" y2="116.6" stroke="#D9D9D6" stroke-width="0.5"/><text x="46" y="120.1" font-size="9.5" fill="#5E5E5B" text-anchor="end">$60,000</text><line x1="52" x2="468" y1="99.4" y2="99.4" stroke="#D9D9D6" stroke-width="0.5"/><text x="46" y="102.9" font-size="9.5" fill="#5E5E5B" text-anchor="end">$80,000</text><line x1="52" x2="468" y1="82.3" y2="82.3" stroke="#D9D9D6" stroke-width="0.5"/><text x="46" y="85.8" font-size="9.5" fill="#5E5E5B" text-anchor="end">$100,000</text><line x1="52" x2="468" y1="65.1" y2="65.1" stroke="#D9D9D6" stroke-width="0.5"/><text x="46" y="68.6" font-size="9.5" fill="#5E5E5B" text-anchor="end">$120,000</text><line x1="52" x2="468" y1="48.0" y2="48.0" stroke="#D9D9D6" stroke-width="0.5"/><text x="46" y="51.5" font-size="9.5" fill="#5E5E5B" text-anchor="end">$140,000</text><rect x="75.0" y="86.6" width="58" height="81.4" fill="#26394D"/><text x="104.0" y="82.6" font-size="10" text-anchor="middle" fill="#1A1A1A">$95,000</text><text x="104.0" y="180" font-size="9.5" text-anchor="middle" fill="#1A1A1A">Shares become</text><text x="104.0" y="191" font-size="9.5" text-anchor="middle" fill="#1A1A1A">worthless</text><rect x="179.0" y="86.6" width="58" height="81.4" fill="#26394D"/><rect x="179.0" y="78.0" width="58" height="8.6" fill="#B9C3CE"/><text x="208.0" y="74.0" font-size="10" text-anchor="middle" fill="#1A1A1A">$105,000</text><text x="208.0" y="180" font-size="9.5" text-anchor="middle" fill="#1A1A1A">Shares fall</text><text x="208.0" y="191" font-size="9.5" text-anchor="middle" fill="#1A1A1A">40% before 2031</text><rect x="283.0" y="86.6" width="58" height="81.4" fill="#26394D"/><rect x="283.0" y="69.4" width="58" height="17.1" fill="#B9C3CE"/><text x="312.0" y="65.4" font-size="10" text-anchor="middle" fill="#1A1A1A">$115,000</text><text x="312.0" y="180" font-size="9.5" text-anchor="middle" fill="#1A1A1A">Shares earn</text><text x="312.0" y="191" font-size="9.5" text-anchor="middle" fill="#1A1A1A">7.5% a year</text><rect x="387.0" y="86.6" width="58" height="81.4" fill="#26394D"/><rect x="387.0" y="56.6" width="58" height="30.0" fill="#B9C3CE"/><text x="416.0" y="52.6" font-size="10" text-anchor="middle" fill="#1A1A1A">$130,000</text><text x="416.0" y="180" font-size="9.5" text-anchor="middle" fill="#1A1A1A">Shares do</text><text x="416.0" y="191" font-size="9.5" text-anchor="middle" fill="#1A1A1A">very well (1 in 20)</text><text x="104.0" y="101.1" font-size="9.5" fill="#fff" text-anchor="middle">Held in</text><text x="104.0" y="112.1" font-size="9.5" fill="#fff" text-anchor="middle">Treasuries</text><text x="104.0" y="123.1" font-size="9.5" fill="#fff" text-anchor="middle">since</text><text x="104.0" y="134.1" font-size="9.5" fill="#fff" text-anchor="middle">January</text><text x="104.0" y="145.1" font-size="9.5" fill="#fff" text-anchor="middle">2028</text><text x="416.0" y="76.7" font-size="9.5" fill="#1A1A1A" text-anchor="middle">From shares</text><text x="0" y="210" font-size="9" fill="#5E5E5B">Source: team model; Treasury