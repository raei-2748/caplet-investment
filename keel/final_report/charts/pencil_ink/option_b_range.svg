<svg xmlns="http://www.w3.org/2000/svg" width="468pt" height="168pt" viewBox="0 0 468 168" font-family="'Times New Roman', Tinos, 'Liberation Serif', Times, serif"><rect width="468" height="168" fill="#fff"/><text x="0" y="15" font-size="13" font-weight="bold" fill="#1A1A1A">Shares move the top of Laura's range, never the bottom</text><text x="0" y="31" font-size="11" fill="#5E5E5B">The range Laura could state to co-sponsors in 2031, by how world shares perform from 2028</text><line x1="150.0" x2="150.0" y1="48" y2="136" stroke="#D9D9D6" stroke-width="0.5"/><text x="150.0" y="148" font-size="9.5" text-anchor="middle" fill="#5E5E5B">$90,000</text><line x1="217.1" x2="217.1" y1="48" y2="136" stroke="#D9D9D6" stroke-width="0.5"/><text x="217.1" y="148" font-size="9.5" text-anchor="middle" fill="#5E5E5B">$100,000</text><line x1="284.2" x2="284.2" y1="48" y2="136" stroke="#D9D9D6" stroke-width="0.5"/><text x="284.2" y="148" font-size="9.5" text-anchor="middle" fill="#5E5E5B">$110,000</text><line x1="351.3" x2="351.3" y1="48" y2="136" stroke="#D9D9D6" stroke-width="0.5"/><text x="351.3" y="148" font-size="9.5" text-anchor="middle" fill="#5E5E5B">$120,000</text><line x1="418.4" x2="418.4" y1="48" y2="136" stroke="#D9D9D6" stroke-width="0.5"/><text x="418.4" y="148" font-size="9.5" text-anchor="middle" fill="#5E5E5B">$130,000</text><text x="0" y="61.5" font-size="10.5" fill="#1A1A1A">Shares become worthless</text><line x1="183.6" x2="183.6" y1="58" y2="58" stroke="#5E5E5B" stroke-width="1.6"/><circle cx="183.6" cy="58" r="4.2" fill="#26394D"/><text x="191.6" y="61.5" font-size="10" fill="#1A1A1A">$95,000</text><text x="0" y="83.5" font-size="10.5" fill="#1A1A1A">Shares fall 40% before 2031</text><line x1="183.6" x2="250.7" y1="80" y2="80" stroke="#5E5E5B" stroke-width="1.6"/><circle cx="183.6" cy="80" r="4.2" fill="#26394D"/><circle cx="250.7" cy="80" r="4.2" fill="#fff" stroke="#26394D" stroke-width="1.4"/><text x="258.7" y="83.5" font-size="10" fill="#1A1A1A">$105,000</text><text x="0" y="105.5" font-size="10.5" fill="#1A1A1A">Shares earn 7.5% a year</text><line x1="183.6" x2="317.8" y1="102" y2="102" stroke="#5E5E5B" stroke-width="1.6"/><circle cx="183.6" cy="102" r="4.2" fill="#26394D"/><circle cx="317.8" cy="102" r="4.2" fill="#fff" stroke="#26394D" stroke-width="1.4"/><text x="325.8" y="105.5" font-size="10" fill="#1A1A1A">$115,000</text><text x="0" y="127.5" font-size="10.5" fill="#1A1A1A">Shares do very well (1 in 20)</text><line x1="183.6" x2="418.4" y1="124" y2="124" stroke="#5E5E5B" stroke-width="1.6"/><circle cx="183.6" cy="124" r="4.2" fill="#26394D"/><circle cx="418.4" cy="124" r="4.2" fill="#fff" stroke="#26394D" stroke-width="1.4"/><text x="426.4" y="127.5" font-size="10" fill="#1A1A1A">$130,000</text><text x="176.6" y="44" font-size="9.5" fill="#26394D" text-anchor="start">Bottom: $95,000 in every case</text><text x="0" y="164" font-size="9" fill="#5E5E5B">Source: team model; Treasury curve of 6 November 2026; both deposits assumed to arrive.</text></svg>