<title>Keel Logbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ship's log. A dated left rail, the entry, and the day's "room" reading in the right margin. */
:root{
  --bg:#eef2f4; --paper:#f8fafb; --ink:#14232c; --muted:#56656e; --rule:#c9d3d9;
  --sea:#1f6f78; --sea-soft:#d5e8e9; --flag:#b23a2e; --flag-soft:#f3dcd8; --brass:#8a6a1f; --brass-soft:#efe5cc;
  --display:"Alegreya Sans SC","Gill Sans",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171d; --paper:#14212a; --ink:#e3ecf0; --muted:#97a8b2; --rule:#2a3a45;
  --sea:#6cc3cb; --sea-soft:#163a3f; --flag:#ec8a7e; --flag-soft:#3d1f1b; --brass:#d8b55e; --brass-soft:#3a3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171d; --paper:#14212a; --ink:#e3ecf0; --muted:#97a8b2; --rule:#2a3a45;
  --sea:#6cc3cb; --sea-soft:#163a3f; --flag:#ec8a7e; --flag-soft:#3d1f1b; --brass:#d8b55e; --brass-soft:#3a3018; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
.wrap{max-width:1040px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:56px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:.01em}
h2{font-size:1.8rem;color:var(--sea);margin-bottom:12px}
h3{font-size:1.2rem;font-weight:500;letter-spacing:.02em}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.85em}
.eyebrow,.note,.meta{color:var(--muted);font-size:.9rem}
.eyebrow{font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;font-size:.75rem}
.hero{display:grid;gap:18px;border-bottom:2px solid var(--ink);padding-bottom:28px}
.lede{max-width:65ch;font-size:1.12rem}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin:4px 0 0}
.stats div{display:grid}
.stats dt{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.mission{max-width:70ch}
.mission span{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);margin-right:8px}
.tabs{display:flex;flex-wrap:wrap;gap:8px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5;border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs a{font-family:var(--display);font-weight:500;color:var(--ink);text-decoration:none;letter-spacing:.03em}
.tabs a:hover,.tabs a:focus-visible{color:var(--sea);text-decoration:underline;outline:none}
section{display:grid;gap:14px;scroll-margin-top:64px}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid}
.ep{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:18px;padding-block:18px;border-top:1px solid var(--rule)}
.when{display:grid;align-content:start;gap:2px}
.num{font-family:var(--mono);font-size:.78rem;color:var(--sea);font-weight:500}
.date{font-family:var(--display);font-weight:500;font-size:1rem}
.body{display:grid;gap:6px;min-width:0}
.body p{max-width:68ch}
.tags{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.tags strong{color:var(--ink);font-weight:500}
.room{display:grid;justify-items:end;align-content:start}
.rv{font-family:var(--mono);font-size:1.05rem;font-weight:500;color:var(--brass);font-variant-numeric:tabular-nums}
.rl{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.person{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:18px;display:grid;gap:8px;align-content:start}
.person h3 span{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.role{font-family:var(--mono);font-size:.78rem;color:var(--sea)}
.line{font-style:italic}
.person dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.person dt{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:4px}
.person dd{margin:0}
.values{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.values li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start}
.vn{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--brass);line-height:1}
.values p{max-width:65ch}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--rule)}
th{font-family:var(--mono);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
.chip{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;padding:2px 7px;border-radius:3px;white-space:normal}
.chip.adopted{background:var(--sea-soft);color:var(--sea)}
.chip.adapted{background:var(--sea-soft);color:var(--sea);outline:1px dashed var(--sea)}
.chip.rejected{background:var(--flag-soft);color:var(--flag)}
.chip.parked{background:var(--brass-soft);color:var(--brass)}
.arcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 28px}
.arcs article{display:grid;gap:6px;align-content:start;border-top:2px solid var(--ink);padding-top:10px}
.stand{font-size:.95rem}
.stand span{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--brass);margin-right:6px}
footer{border-top:1px solid var(--rule);padding-top:16px;color:var(--muted);font-size:.85rem}
@media (max-width:620px){.ep{grid-template-columns:minmax(0,1fr) auto}.when{grid-column:1/-1;grid-auto-flow:column;justify-content:start;gap:10px;align-items:baseline}.body{grid-column:1}.room{grid-column:2;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
html{scroll-behavior:smooth}
</style>
