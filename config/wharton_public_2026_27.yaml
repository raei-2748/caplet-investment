  permitted_uses:
    - "Brainstorming and idea generation"
    - "Exploring perspectives and challenging assumptions"
  prohibited_uses:
    - "Submitting AI-generated text as student work"
    - "Plagiarism and academic dishonesty"
    - "Uncredited generative AI content"
  warnings:
