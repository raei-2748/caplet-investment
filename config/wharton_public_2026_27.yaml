team_rules:
  min_students: 4
  max_students: 6
  eligibility: "Students must attend the same secondary school."
  team_leader_min_age: "16 by 2026-09-28"
  advisor: "One Advisor who is a teacher/educator at the team's school; may not make decisions or trade. Paid advisors or consultants are prohibited."
  member_changes: "Removing a member requires a written Advisor request approved by Wharton."
  account_structure: "One shared WInS account per registered team."
  student_responsibilities: "Students are responsible for developing strategy, conducting research, analyzing data, and placing trades."
  team_leader_role: "Primary communication liaison and deliverable submitter."

