# config/client_mandate.yaml
# OFFICIAL 2026-27 client: Laura Gao.
# Source: competition/official/2026_27/client_case_laura_gao_2026.pdf (Wharton Global Youth Program, released 2026-09-15)
# The previous demo client (Dr. Elena Vance) is preserved in config/demo_client_mandate.yaml.
# Facts below are transcribed from the case. Items marked TEAM_DECISION are ours to recommend, not given by the case.

client_name: "Laura Gao"
human_approved: false          # set true once the student committee has reviewed this transcription
source_document: "competition/official/2026_27/client_case_laura_gao_2026.pdf"

client:
  name: "Laura Gao"
  description: >
    Bestselling graphic novelist (The Wuhan I Know; Messy Roots), illustrator, entrepreneur, educator and
    public speaker. Born in Wuhan, raised in Texas; Wharton BS 2018 (Statistics & Information Decisions
    Management); former tech product manager. Plans a collaborative creative residency in Taiwan from 2033.
  objectives: >
    (1) Fund ten fixed $50,000 annual operating payments (2033-2042) with a high degree of certainty from the
    portfolio alone. (2) After setting aside that operating reserve in 2033, contribute a responsible amount
    toward the residency facility while preserving financial flexibility. (3) In 2031, communicate a credible
    dollar range for the 2033 facility contribution to prospective co-sponsors.
  values:
    - "Storytelling; identity, belonging and community"
    - "Education (her books are used in classrooms)"
    - "Creativity combined with entrepreneurship; willingness to pursue unconventional opportunities"
    - "Supporting artists, writers, designers, entrepreneurs and educators"
  exclusions: []               # none specified by the case
  risk_attitude: >
    Has taken thoughtful risks in her career; understands volatility; wants an appropriate balance between
    pursuing growth and protecting the capital required for her goals.

timeline_convention:
  year_zero: 2026              # Year N = calendar year - 2026
  cash_flow_timing: "beginning_of_year"

cash_flows:
  contributions:
    - {year: 2027, year_index: 1, amount_usd: 300000, source: "initial investment"}
    - {year: 2028, year_index: 2, amount_usd: 150000, source: "publishing advances, speaking, licensing, other ventures"}
  no_other_flows_before: 2033   # no additions or withdrawals before 2033
  operating_commitment:
    payment_usd: 50000
    count: 10
    first_year: 2033
    last_year: 2042
    inflation_adjusted: false
    certainty_required: "high degree of certainty (definition is a TEAM_DECISION)"
    outside_funding_allowed: false   # co-sponsors, grants, fees may NOT be relied upon
  operating_reserve:
    set_aside_date: "start of 2033, before first payment and before facility contribution"
    size: TEAM_DECISION
    composition: TEAM_DECISION
    composition_path_2033_2042: TEAM_DECISION
  facility_contribution:
    date: "2033, after reserve is set aside"
    amount: TEAM_DECISION        # no predetermined amount; must preserve flexibility
  cosponsor_communication:
    date: 2031
    deliverable: "dollar range + stated confidence + fundraising-material draft (students write prose)"

scope_exclusions:
  - "personal income and capital gains taxes"
  - "Taiwan legal/regulatory requirements"
  - "facility total cost, construction budget, funding gap, business plan"
  - "size/composition of any separate contingency fund or endowment"
  - "WInS gains/losses are NOT added to long-term projections"

assumptions_required_by_case:
  - "investment performance"
  - "timing of cash flows"
  - "outside funding"
  - "inflation effect on portfolio projections and facility costs"
  - "financial flexibility to preserve"
  - "favourable and unfavourable outcomes"
