# config/client_mandate.yaml
# Official 2026-27 client mandate, structured to wharton_ic.client.models.ClientMandate.
# Source: competition/official/2026_27/Laura_Gao_2026_Client_Profile.pdf (4 pages).
# CLIENT_FACT items restate the case and cite its page. Team reasoning belongs in
# TEAM_INTERPRETATION / STRATEGIC_ASSUMPTION items and must be signed off via
# `wharton-ic client approve` before strategy generation.

client_id: "WGHSIC-2026-27-LAURA-GAO"
client_name: "Laura Gao"
mandate_version: "1.0"
created_at: "2026-09-26 00:00:00"

financial_objectives:
  - item_id: "FO-01"
    category: "CLIENT_FACT"
    statement: >-
      Fund ten annual operating payments of $50,000 (fixed, not inflation-adjusted) at the
      beginning of each year 2033-2042 with a high degree of certainty, from the portfolio alone.
    official_source_citation: "Client Profile p.3, Operating Commitment"
  - item_id: "FO-02"
    category: "CLIENT_FACT"
    statement: >-
      At the beginning of 2033, set aside an operating reserve for the ten payments; team must
      recommend its size, initial composition, and how composition changes as payments are made.
    official_source_citation: "Client Profile p.3, Operating Commitment"
  - item_id: "FO-03"
    category: "CLIENT_FACT"
    statement: >-
      After establishing the reserve in 2033, recommend and justify how much of the remaining
      portfolio Laura can responsibly contribute to the residency facility.
    official_source_citation: "Client Profile p.3, Facility Contribution"
  - item_id: "FO-04"
    category: "CLIENT_FACT"
    statement: >-
      Preserve appropriate financial flexibility; committing all remaining assets could limit
      flexibility as the project develops.
    official_source_citation: "Client Profile p.3, Facility Contribution; p.4 bullet list"

nonfinancial_objectives:
  - item_id: "NFO-01"
    category: "CLIENT_FACT"
    statement: >-
      In 2031, communicate a credible dollar range (not a single number) for the 2033 facility
      contribution to co-sponsors, with a stated confidence level; the range must protect the
      operating commitment. Team drafts part of the fundraising materials.
    official_source_citation: "Client Profile p.3-4, Communicating with Co-Sponsors"
  - item_id: "NFO-02"
    category: "CLIENT_FACT"
    statement: >-
      Protect Laura's credibility: promising more than she can contribute could damage her
      credibility and co-sponsor participation.
    official_source_citation: "Client Profile p.3, Communicating with Co-Sponsors"

investment_horizon:
  item_id: "IH-01"
  category: "CLIENT_FACT"
  statement: >-
    Contributions at the beginning of 2027 (Year 1) and 2028 (Year 2); reserve and facility
    contribution at the beginning of 2033 (Year 7); final operating payment at the beginning of
    2042 (Year 16). Year number = calendar year - 2026.
  official_source_citation: "Client Profile p.2-3"

liquidity_requirements:
  item_id: "LR-01"
  category: "CLIENT_FACT"
  statement: >-
    No withdrawals before 2033. From 2033: reserve set-aside, facility contribution, then
    $50,000 at the beginning of each year through 2042. Living expenses are covered outside the
    portfolio.
  official_source_citation: "Client Profile p.2-3"

return_objectives:
  item_id: "RO-01"
  category: "CLIENT_FACT"
  statement: >-
    No stated return target. Projections start from $300,000 (2027) plus $150,000 (2028) using
    reasonable return assumptions consistent with the strategy; WInS trading gains or losses are
    not added to projections.
  official_source_citation: "Client Profile p.2, p.4 Developing Laura's Investment Strategy"

risk_tolerance:
  item_id: "RT-01"
  category: "CLIENT_FACT"
  statement: >-
    Understands investing involves uncertainty and volatility; has taken thoughtful risks in her
    career; wants the team to recommend a balance between pursuing growth and protecting the
    capital required for her goals.
  official_source_citation: "Client Profile p.2, Laura's Financial Goals"

risk_capacity:
  item_id: "RC-01"
  category: "CLIENT_FACT"
  statement: >-
    Living expenses and short-term needs are met outside the portfolio, but the ten operating
    payments cannot rely on outside funding.
  official_source_citation: "Client Profile p.2-3"

drawdown_concerns:
  item_id: "DC-01"
  category: "CLIENT_FACT"
  statement: >-
    No numeric drawdown limit is given. Teams must explain how favorable and unfavorable market
    outcomes affect the operating commitment and the facility contribution.
  official_source_citation: "Client Profile p.3-4"

income_needs:
  item_id: "IN-01"
  category: "CLIENT_FACT"
  statement: "No income needs from the portfolio before 2033."
  official_source_citation: "Client Profile p.2"

ethical_preferences: []
impact_objectives:
  - item_id: "IO-01"
    category: "CLIENT_FACT"
    statement: >-
      Establish a collaborative creative residency in Taiwan in 2033 for artists, writers,
      designers, entrepreneurs, and educators.
    official_source_citation: "Client Profile p.2, The Creative Residency"
sector_preferences: []
explicit_exclusions: []
implicit_constraints:
  - item_id: "IC-01"
    category: "CLIENT_FACT"
    statement: >-
      Taxes and Taiwan legal/regulatory requirements are out of scope; teams need not estimate
      facility cost, funding gap, or size a separate contingency fund.
    official_source_citation: "Client Profile p.3-4"

uncertainties:
  - "2033 portfolio value (and therefore facility contribution) is uncertain when the range is communicated in 2031."
  - "Inflation affects facility costs and real portfolio projections; operating payments are fixed nominal."
tensions_or_conflicts:
  - "Growth for a larger facility contribution vs. high certainty for the operating commitment."
  - "A meaningful contribution signals commitment vs. preserving financial flexibility."
  - "A wide range protects credibility vs. a narrow range is more useful to co-sponsors."
assumptions_requiring_student_judgment:
  - "Definition of 'high degree of certainty' and how it is evaluated."
  - "Return, inflation, and cash-flow timing assumptions for projections."
  - "Operating reserve size and composition, and its glide path as payments are made."
  - "Dollar range and confidence level communicated to co-sponsors in 2031."
evidence_source_ids:
  - "competition/official/2026_27/Laura_Gao_2026_Client_Profile.pdf"

human_approved: false
approved_by: null
approval_timestamp: null
approval_rationale: null
