# config/risk.yaml
# Portfolio Risk Limits, Factor Shocks, and Stress Test Configurations

risk_limits:
  target_annual_volatility: 0.14
  max_portfolio_volatility: 0.18
  max_drawdown_limit: 0.20
  var_confidence_level: 0.95
  cvar_confidence_level: 0.95
  max_marginal_cvar_contribution: 0.20
  max_beta_to_benchmark: 1.15
  min_beta_to_benchmark: 0.70
  max_tracking_error: 0.08
  max_pairwise_correlation: 0.75
  max_top_5_weight: 0.55

stress_scenarios:
  historical:
    gfc_2008:
      name: "2008 Global Financial Crisis"
      start_date: "2008-09-01"
      end_date: "2009-03-09"
      description: "Severe credit contraction, market decline ~50%, flight to quality."
    covid_2020:
      name: "2020 Covid Liquidity Shock"
      start_date: "2020-02-19"
      end_date: "2020-03-23"
      description: "Rapid liquidity drawdown of 34% followed by aggressive monetary intervention."
    inflation_2022:
      name: "2022 Stagflation / Fed Rate Hikes"
      start_date: "2022-01-03"
      end_date: "2022-10-12"
      description: "Simultaneous stock and bond sell-off driven by aggressive interest rate hikes."

  synthetic_shocks:
    interest_rate_shock:
      name: "+200 bps Parallel Yield Curve Shift"
      equity_discount_rate_delta: 0.02
      growth_multiple_contraction: -0.15
      defensive_multiple_contraction: -0.05
    energy_supply_shock:
      name: "+30% Oil & Gas Price Surge"
      energy_equity_shock: 0.20
      consumer_discretionary_shock: -0.12
      industrial_shock: -0.06
    tech_valuation_reset:
      name: "Tech Multiple Compression (-25%)"
      information_technology_shock: -0.25
      communication_services_shock: -0.18
      healthcare_shock: -0.04
      utilities_shock: 0.02

monte_carlo:
  num_simulations: 5000
  time_horizon_days: 252           # 1-year forward projection
  distribution: "student_t"        # Fat-tailed distribution (nu=5) for realistic tail risk
  degrees_of_freedom: 5
  seed: 42
